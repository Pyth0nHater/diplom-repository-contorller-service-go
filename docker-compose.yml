services:
  postgres:
    image: postgres:17-alpine
    container_name: repo-ctrl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repo_controller
      POSTGRES_USER: repo_ctrl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repo_ctrl_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_ctrl -d repo_controller"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: repo-ctrl-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
